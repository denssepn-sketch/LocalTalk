name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Montar projeto
        run: |
          mkdir -p proj/app/src/main/java/br/com/localtalk proj/app/src/main/assets
          cp AndroidManifest.xml proj/app/src/main/
          cp MainActivity.java proj/app/src/main/java/br/com/localtalk/
          cp index.html proj/app/src/main/assets/
          RES=proj/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $RES/mipmap-$d; cp ic_launcher.png $RES/mipmap-$d/ic_launcher.png; done
          mkdir -p $RES/mipmap-anydpi-v26 $RES/drawable-nodpi $RES/values
          cp ic_foreground.png $RES/drawable-nodpi/ic_foreground.png
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_bg"/><foreground android:drawable="@drawable/ic_foreground"/></adaptive-icon>' > $RES/mipmap-anydpi-v26/ic_launcher.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_bg">#030A3C</color></resources>' > $RES/values/colors.xml
          cd proj
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" >
