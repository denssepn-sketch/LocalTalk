<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;font-family:inherit}
:root{--bg:#070b14;--p:#0f1829;--l:#1b2740;--t:#e9efff;--m:#8a97b3;--a:#2f6bff;--r:#ff4d5e;--g:#27c46b}
html,body{height:100%;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0}
button{background:var(--l);border-radius:12px;padding:10px 14px;cursor:pointer}
.pri{background:var(--a);color:#fff}
#splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
h1{font:400 44px Georgia,serif}h1 b,.logo span{color:var(--a);font-weight:400}
#splash p{letter-spacing:.3em;color:var(--m);font-size:12px}
#splash img{border-radius:24px}
input,textarea{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;width:100%}
#splash input,#splash button{max-width:300px;width:100%}
#err{color:var(--r);max-width:320px}
#app{height:100%;display:flex;flex-direction:column-reverse;padding-top:env(safe-area-inset-top)}
nav{display:flex;background:var(--p);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:14px 4px;color:var(--m)}nav button.sel{color:var(--a)}
.logo{display:none;font:400 26px Georgia,serif;padding:18px}
main{flex:1;min-height:0;display:flex;flex-direction:column;max-width:900px;width:100%;margin:auto}
.pc #app{flex-direction:row}.pc nav{flex-direction:column;justify-content:flex-start;width:210px;border:0;border-right:1px solid var(--l)}.pc nav button{text-align:left;padding:14px 20px}.pc .logo{display:block}
section{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:10px;overflow:auto}
#hd{padding:12px 16px;border-bottom:1px solid var(--l);color:var(--m);font-size:13px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--l);align-self:flex-start;word-break:break-word}
.m small{display:block;color:var(--m);font-size:11px}.m.me{background:var(--a);align-self:flex-end}.m.me small{color:#cfe0ff}
.m.s{align-self:center;background:none;color:var(--m);font-size:12px}
#bar,#inp{display:flex;gap:8px}#tx{flex:1}
#ptt{flex:1;padding:22px;font-size:17px;background:var(--p);border:2px solid var(--a);border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#ptt.tx{background:var(--r);border-color:var(--r)}#ptt:disabled{opacity:.5;border-color:var(--l)}
.it{display:flex;align-items:center;gap:10px;background:var(--p);padding:12px;border-radius:14px}.it div{flex:1}.it small{display:block;color:var(--m)}
i.d{width:9px;height:9px;border-radius:50%;background:var(--m)}i.d.on{background:var(--g)}
.ck{display:flex;gap:10px;align-items:center}.ck input{width:20px;height:20px}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}

<script>
const $=s=>document.querySelector(s),rnd=()=>Math.random().toString(36).slice(2,8);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ID=localStorage.lt_id||(localStorage.lt_id=rnd());
let NAME=localStorage.lt_name||'',mic=null,peers={},talk={},hist=[],cur='chat',txOn=0,pend,md='',wl,ac;
let opt={beep:1,wake:0,bg:0};try{opt=Object.assign(opt,JSON.parse(localStorage.lt_opt))}catch(e){}
try{hist=JSON.parse(localStorage.lt_h||'[]')}catch(e){}
const seen=new Set(hist.map(x=>x.id));let fvOn=0;const uid=()=>rnd()+Date.now().toString(36)+rnd();
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();const f=()=>{if(pc.iceGatheringState=='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,3000)});
const tx=(p,m)=>{if(p.dc&&p.dc.readyState=='open')p.dc.send(JSON.stringify(m))},all=m=>Object.values(peers).forEach(p=>tx(p,m));
function beep(f=880,d=.1){if(!opt.beep)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const enc=async d=>{const s=new Blob([JSON.stringify({type:d.type,sdp:d.sdp})]).stream().pipeThrough(new CompressionStream('deflate-raw'));const b=new Uint8Array(await new Response(s).arrayBuffer());let x='';b.forEach(c=>x+=String.fromCharCode(c));return 'LT1:'+btoa(x)};
const dec=async c=>{c=c.trim();if(!c.startsWith('LT1:'))throw Error('código inválido');const b=Uint8Array.from(atob(c.slice(4)),k=>k.charCodeAt());return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text())};
function mk(id){const p=peers[id]={id,name:'Dispositivo',on:0,pc:new RTCPeerConnection({iceServers:[]})};
 if(mic)mic.getTracks().forEach(t=>p.pc.addTrack(t,mic));else p.pc.addTransceiver('audio',{direction:'recvonly'});
 p.pc.ontrack=e=>{p.au=p.au||new Audio();p.au.srcObject=e.streams[0]||new MediaStream([e.track]);p.au.play().catch(()=>{})};
 p.pc.onconnectionstatechange=()=>{const s=p.pc.connectionState;p.on=s=='connected'?1:0;if(s=='failed'||s=='closed')drop(p.id);else if(s=='disconnected')setTimeout(()=>{if(peers[p.id]===p&&p.pc.connectionState!='connected')drop(p.id)},6000);ui()};
 return p}
function drop(id){const p=peers[id];if(!p)return;delete peers[id];delete talk[id];try{p.pc.close()}catch(e){}if(p.au)p.au.srcObject=null;if(p.hi)sys(p.name+' saiu da rede');ui()}
function dcs(p,dc){p.dc=dc;dc.onopen=()=>tx(p,{t:'hi',id:ID,name:NAME});dc.onmessage=e=>{try{on(p,JSON.parse(e.data))}catch(x){}}}
async function dial(id,via){const p=mk(id);dcs(p,p.pc.createDataChannel('c'));await p.pc.setLocalDescription(await p.pc.createOffer());await gather(p.pc);tx(via,{t:'sig',to:id,from:ID,k:'offer',d:p.pc.localDescription.sdp})}
async function on(p,m){
 if(m.t=='hi'){if(p.id!=m.id){if(peers[m.id]&&peers[m.id]!==p)drop(m.id);delete peers[p.id];p.id=m.id;peers[m.id]=p}p.name=m.name;p.on=1;if(!p.hi){p.hi=1;sys(m.name+' conectou');beep(700);$('#modal').hidden=true;if(roomOn&&p===pend)roomNew().catch(()=>{});hist.filter(h=>h.pd&&h.from==ID).forEach(h=>tx(p,pub(h)))}
  tx(p,{t:'peers',l:Object.values(peers).filter(x=>x!==p&&x.hi).map(x=>x.id)});ui()}
 else if(m.t=='peers')m.l.forEach(id=>{if(id==ID||peers[id])return;if(ID>id)dial(id,p);else tx(p,{t:'sig',to:id,from:ID,k:'want'})});
 else if(m.t=='sig'){if(m.to!=ID){const q=peers[m.to];if(q)tx(q,m);return}
  if(m.k=='want'){if(!peers[m.from])dial(m.from,p)}
  else if(m.k=='offer'){if(peers[m.from])return;const q=mk(m.from);q.pc.ondatachannel=e=>dcs(q,e.channel);await q.pc.setRemoteDescription({type:'offer',sdp:m.d});await q.pc.setLocalDescription(await q.pc.createAnswer());await gather(q.pc);tx(p,{t:'sig',to:m.from,from:ID,k:'answer',d:q.pc.localDescription.sdp})}
  else if(m.k=='answer'){const q=peers[m.from];if(q)await q.pc.setRemoteDescription({type:'answer',sdp:m.d})}}
 else if(m.t=='msg'){tx(p,{t:'ack',id:m.id});if(seen.has(m.id))return;seen.add(m.id);add(pub(m));beep(660)}
 else if(m.t=='ack'){const x=hist.find(h=>h.id==m.id&&h.from==ID);if(x){x.ak=x.ak||[];if(!x.ak.includes(p.id)){x.ak.push(p.id);x.pd=0;save();render()}}}
 else if(m.t=='call'){sys(p.name+' está chamando 🔔');beep(1000,.4);navigator.vibrate&&navigator.vibrate([300,100,300])}
 else if(m.t=='tx'){if(m.on)talk[p.id]=1;else{delete talk[p.id];beep(520,.08)}ui()}
 else if(m.t=='name'){p.name=m.name;ui()}
 else if(m.t=='kick'){if(m.id==ID){sys('Você foi removido da rede');Object.keys(peers).forEach(drop)}else drop(m.id)}}
async function invite(){if(pend&&!pend.hi)drop(pend.id);pend=mk('tmp'+rnd());dcs(pend,pend.pc.createDataChannel('c'));await pend.pc.setLocalDescription(await pend.pc.createOffer());await gather(pend.pc);return enc(pend.pc.localDescription)}
async function join(c){const o=await dec(c),p=mk('tmp'+rnd());p.pc.ondatachannel=e=>dcs(p,e.channel);await p.pc.setRemoteDescription(o);await p.pc.setLocalDescription(await p.pc.createAnswer());await gather(p.pc);return enc(p.pc.localDescription)}
function setMode(m){md=m;$('#l2').hidden=$('#c2').hidden=$('#cp1').hidden=$('#cp2').hidden=false;$('#c1').inputMode='text';const i=m=='i';$('#modal').hidden=false;$('#l1').textContent=i?'1) Envie este convite ao outro aparelho':'1) Cole o convite recebido';$('#l2').textContent=i?'2) Cole aqui a resposta dele':'2) Envie esta resposta ao primeiro aparelho';$('#c1').readOnly=i;$('#c2').readOnly=!i;$('#c1').value=$('#c2').value='';$('#act').textContent=i?'Conectar':'Gerar resposta';$('#act').hidden=false;$('#hint').textContent='';
 if(i){$('#c1').value='Gerando…';invite().then(c=>$('#c1').value=c).catch(e=>$('#hint').textContent='Erro: '+e.message)}}
// ---- Sala por código (precisa do módulo nativo window.LTNative; sem ele os botões ficam ocultos) ----
const nat=window.LTNative;let roomOn=0;
const setRoom=t=>{$('#rm').textContent=t;$('#rm').hidden=!t};
async function roomNew(){try{const c=await invite(),code=await nat.host(NAME,c);setRoom('Sala aberta · código '+code+' (vale 10 min)');return code}catch(e){roomOn=0;setRoom('');$('#rc').textContent='🔢 Criar sala com código';throw e}}
window.ltOnAnswer=async a=>{try{if(pend&&!pend.hi)await pend.pc.setRemoteDescription(await dec(a))}catch(e){sys('Resposta de conexão inválida')}};
async function codeJoin(){const code=$('#c1').value.replace(/\D/g,'');if(code.length!=6)throw Error('o código tem 6 dígitos');$('#hint').textContent='Procurando a sala na rede…';const f=await nat.fetchOffer(code);$('#hint').textContent='Sala "'+f.name+'" encontrada. Conectando…';await nat.sendAnswer(f,code,await join(f.offer));$('#act').hidden=true}
if(nat){$('#rc').hidden=$('#rj').hidden=false;
 $('#rc').onclick=async()=>{if(roomOn){roomOn=0;try{nat.stop()}catch(e){}setRoom('');$('#rc').textContent='🔢 Criar sala com código';return}
  roomOn=1;$('#rc').textContent='✖ Fechar sala';$('#modal').hidden=false;md='r';$('#act').hidden=true;$('#l1').textContent='Código da sala (diga ou mostre aos outros aparelhos)';$('#c1').readOnly=true;$('#c1').value='Criando…';$('#l2').hidden=$('#c2').hidden=$('#cp2').hidden=true;$('#hint').textContent='Quem estiver na mesma rede digita o código em "Entrar com código".';
  try{$('#c1').value=await roomNew()}catch(e){$('#c1').value='';$('#hint').textContent='Erro: '+e.message}};
 $('#rj').onclick=()=>{md='c';$('#modal').hidden=false;$('#l1').textContent='Digite o código de 6 dígitos da sala';$('#c1').readOnly=false;$('#c1').value='';$('#c1').inputMode='numeric';$('#l2').hidden=$('#c2').hidden=$('#cp1').hidden=$('#cp2').hidden=true;$('#act').textContent='Entrar';$('#act').hidden=false;$('#hint').textContent=''}}
$('#bi').onclick=()=>setMode('i');$('#bj').onclick=()=>setMode('j');$('#x').onclick=()=>$('#modal').hidden=true;
$('#act').onclick=async()=>{try{if(md=='c')await codeJoin();else if(md=='i'){const o=await dec($('#c2').value);await pend.pc.setRemoteDescription(o);$('#hint').textContent='Conectando…'}else{$('#c2').value=await join($('#c1').value);$('#act').hidden=true;$('#hint').textContent='Envie a resposta e aguarde conectar…'}}catch(e){$('#hint').textContent='Erro: '+e.message}};
const cp=el=>{el.select();document.execCommand('copy');navigator.clipboard&&navigator.clipboard.writeText(el.value).catch(()=>{})};
$('#cp1').onclick=()=>cp($('#c1'));$('#cp2').onclick=()=>cp($('#c2'));
const save=()=>{try{localStorage.lt_h=JSON.stringify(hist)}catch(e){}};
const stat=m=>m.from!=ID?'':m.ak&&m.ak.length?' ✓✓':m.pd?' ⏳ pendente':' ✓';
const pub=m=>({t:'msg',id:m.id,from:m.from,name:m.name,text:m.text,ts:m.ts});
function draw(m){const b=E('div','m '+(m.sys?'s':m.from==ID?'me':'th'));if(!m.sys&&m.from!=ID)b.append(E('small','',m.name));b.append(E('div','',m.text));if(!m.sys){const s=E('small','',new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+stat(m)),f=E('span','fv'+(m.fav?' on':''),'⭐');f.onclick=()=>{m.fav=m.fav?0:1;save();render()};s.prepend(f);b.append(s)}$('#msgs').append(b);$('#msgs').scrollTop=1e9}
function render(){const q=$('#q').value.trim().toLowerCase();$('#msgs').textContent='';hist.filter(m=>(!fvOn||m.fav)&&(!q||(m.text||'').toLowerCase().includes(q)||(m.name||'').toLowerCase().includes(q))).forEach(draw)}
function add(m){hist=hist.concat(m).slice(-500);save();if(!$('#q').value&&!fvOn)draw(m);else render()}
const sys=t=>add({sys:1,text:t,ts:Date.now(),id:rnd()});
function send(){const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';const m={t:'msg',id:uid(),from:ID,name:NAME,text:v,ts:Date.now(),ak:[]};m.pd=Object.values(peers).some(x=>x.hi&&x.on)?0:1;seen.add(m.id);add(m);all(pub(m))}
$('#snd').onclick=send;$('#tx').onkeydown=e=>{if(e.key=='Enter')send()};
$('#call').onclick=()=>{all({t:'call'});sys('Você chamou todos 🔔');beep(1000,.3)};
function pttOn(){if(!mic||txOn||Object.keys(talk).length)return;txOn=1;mic.getAudioTracks()[0].enabled=true;all({t:'tx',on:true});ui()}
function pttOff(){if(!txOn)return;txOn=0;mic.getAudioTracks()[0].enabled=false;all({t:'tx',on:false});beep(520,.08);ui()}
const pb=$('#ptt');pb.onpointerdown=e=>{pb.setPointerCapture(e.pointerId);pttOn()};pb.onpointerup=pb.onpointercancel=pttOff;pb.oncontextmenu=e=>e.preventDefault();
document.onkeydown=e=>{if(e.code=='Space'&&!e.repeat&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&cur=='chat'){e.preventDefault();pttOn()}};
document.onkeyup=e=>{if(e.code=='Space')pttOff()};
function ui(){const L=Object.values(peers).filter(p=>p.hi&&p.on),w=Object.keys(talk).map(i=>peers[i]&&peers[i].name).filter(Boolean);
 $('#hd').textContent=(L.length?L.length+' dispositivo(s) conectado(s)':'Sem dispositivos conectados')+(w.length?' · 🎙 '+w.join(', ')+' falando':'');
 pb.disabled=!mic;pb.classList.toggle('tx',!!txOn);pb.textContent=!mic?'Voz indisponível':txOn?'🎙 Falando…':w.length?'Canal ocupado':'Segure para falar';
 const d=$('#dl');d.textContent='';const row=(n,s,on,btns)=>{const r=E('div','it'),i=E('i','d'+(on?' on':'')),t=E('div');t.append(E('b','',n),E('small','',s));r.append(i,t,...btns);d.append(r)};
 row(NAME+' (este aparelho)','Online',1,[]);
 Object.values(peers).forEach(p=>{const m=E('button','',p.au&&p.au.muted?'🔇':'🔊'),x=E('button','','✕');m.onclick=()=>{if(p.au)p.au.muted=!p.au.muted;ui()};x.title='Remover da rede';x.onclick=()=>{if(confirm('Remover '+p.name+' da rede?')){all({t:'kick',id:p.id});drop(p.id)}};row(p.name,p.hi&&p.on?'Conectado':'Conectando…',p.hi&&p.on,[m,x])})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{cur=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('sel',x==b));['chat','dev','cfg'].forEach(v=>$('#v-'+v).hidden=v!=cur)});
function wav(){const n=8000,b=new DataView(new ArrayBuffer(44+n)),s=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt()));s(0,'RIFF');b.setUint32(4,36+n,true);s(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,8000,true);b.setUint32(28,8000,true);b.setUint16(32,1,true);b.setUint16(34,8,true);s(36,'data');b.setUint32(40,n,true);for(let i=0;i<n;i++)b.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const ka=new Audio();ka.loop=true;ka.src=wav();
async function applyOpt(){localStorage.lt_opt=JSON.stringify(opt);try{if(opt.wake&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.onrelease=()=>wl=null}else if(!opt.wake&&wl)wl.release()}catch(e){}
 if(opt.bg){ka.play().catch(()=>{});if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:'LocalTalk',artist:'Rádio ativo na rede local'})}else ka.pause()}
document.onvisibilitychange=()=>{if(!document.hidden)applyOpt()};
[['o1','beep'],['o2','wake'],['o3','bg']].forEach(([id,k])=>{$('#'+id).checked=!!opt[k];$('#'+id).onchange=e=>{opt[k]=e.target.checked?1:0;applyOpt()}});
$('#cn').onchange=e=>{NAME=e.target.value.trim()||NAME;localStorage.lt_name=NAME;all({t:'name',name:NAME});ui()};
$('#q').oninput=render;$('#fv').onclick=()=>{fvOn=!fvOn;$('#fv').classList.toggle('pri',!!fvOn);render()};
$('#nm').value=NAME;
$('#go').onclick=async()=>{NAME=$('#nm').value.trim()||'Dispositivo '+ID.slice(0,3);localStorage.lt_name=NAME;$('#cn').value=NAME;
 if(!window.RTCPeerConnection||!window.CompressionStream){$('#err').textContent='Navegador sem suporte. Use Chrome, Edge ou Safari atualizados.';return}
 try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});mic.getAudioTracks()[0].enabled=false}catch(e){mic=null}
 $('#splash').hidden=true;$('#app').hidden=false;render();if(!mic)sys('Microfone indisponível: chat e recebimento de voz ativos, mas falar está desativado. Abra por HTTPS e permita o microfone.');
 applyOpt();ui()};
</script></body></html>
