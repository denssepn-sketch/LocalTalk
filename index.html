'use strict';
// Roda o <script> real do index.html num DOM falso e testa canais, fila de PTT e administrador.
const fs = require('fs'), vm = require('vm'), assert = require('assert');
const html = fs.readFileSync(process.argv[2] || '/mnt/user-data/outputs/index.html', 'utf8');
const code = html.match(/<script>([\s\S]*?)<\/script>/)[1];

function makeCtx() {
  const mkEl = () => new Proxy({ value: '', textContent: '', hidden: false, checked: false, style: {}, children: [],
    classList: { toggle() {}, add() {}, remove() {} }, dataset: {} }, {
    get: (t, k) => k in t ? t[k] : (t[k] = () => mkEl()),
    set: (t, k, v) => (t[k] = v, true) });
  const els = {};
  const document = { querySelector: s => els[s] || (els[s] = mkEl()), querySelectorAll: () => [], createElement: () => mkEl(), hidden: false };
  const sandbox = { document, localStorage: {}, navigator: { vibrate() {} }, Blob, URL, DataView, ArrayBuffer, Uint8Array, Audio: class { play() { return Promise.resolve() } pause() {} },
    setInterval: () => 0, setTimeout, console, confirm: () => true, MediaStream: class {}, RTCPeerConnection: class { close() {} } };
  sandbox.window = sandbox;
  const ctx = vm.createContext(sandbox);
  vm.runInContext(code, ctx);
  return ctx;
}
const run = (ctx, c) => vm.runInContext(c, ctx);

// Cria um par falso conectado; devolve as mensagens enviadas a ele.
function peer(ctx, id, name) {
  const sent = [];
  ctx.__p = { id, name, hi: 1, on: 1, dc: { readyState: 'open', send: m => sent.push(JSON.parse(m)) }, pc: { close() {} }, au: { muted: false } };
  run(ctx, `peers['${id}']=__p`);
  return { p: ctx.__p, sent };
}
const recv = (ctx, id, m) => { ctx.__m = m; return run(ctx, `on(peers['${id}'],__m)`); };
const ID = ctx => run(ctx, 'ID');
const newCtx = () => { const c = makeCtx(); run(c, "mic={getAudioTracks:()=>[{enabled:false}]}"); return c; };

const tests = [];
const test = (n, f) => tests.push([n, f]);

test('mensagem fica no canal em que foi enviada e traz o campo ch', async () => {
  const c = newCtx(), b = peer(c, 'B', 'Bia');
  run(c, "$('#tx').value='oi';chn='Equipes';send()");
  const m = b.sent.find(x => x.t == 'msg');
  assert.strictEqual(m.ch, 'Equipes');
});

test('mensagem recebida de outro canal vira não lida e não aparece no canal atual', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'msg', id: 'm1', from: 'B', name: 'Bia', text: 'x', ts: 1, ch: 'Coordenação' });
  assert.strictEqual(run(c, "unr['Coordenação']"), 1);
  assert.strictEqual(run(c, "hist.filter(inCh).length"), 0);
  run(c, "setCh('Coordenação')");
  assert.strictEqual(run(c, "unr['Coordenação']"), 0);
  assert.strictEqual(run(c, "hist.filter(inCh).length"), 1);
});

test('canal inválido cai em Geral', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'msg', id: 'm2', from: 'B', name: 'Bia', text: 'x', ts: 1, ch: 'Hack' });
  assert.strictEqual(run(c, "hist[hist.length-1].ch"), 'Geral');
});

test('PTT livre: transmite e avisa o canal', async () => {
  const c = newCtx(), b = peer(c, 'B', 'Bia');
  run(c, 'pttOn()');
  assert.strictEqual(run(c, 'txOn'), 1);
  assert.deepStrictEqual(b.sent.find(x => x.t == 'tx'), { t: 'tx', on: true, ch: 'Geral' });
  run(c, 'pttOff()');
  assert.strictEqual(b.sent.filter(x => x.t == 'tx').pop().ch, 'Geral');
});

test('canal ocupado: entra na fila em vez de transmitir', async () => {
  const c = newCtx(), b = peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Geral' });
  run(c, 'pttOn()');
  assert.strictEqual(run(c, 'txOn'), 0);
  assert.strictEqual(run(c, 'wq'), 'Geral');
  assert.ok(b.sent.find(x => x.t == 'q' && x.on));
});

test('quando o canal libera e é a vez, avisa e permite falar', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Geral' });
  run(c, 'pttOn()');
  const antes = run(c, 'hist.length');
  await recv(c, 'B', { t: 'tx', on: false, ch: 'Geral' });
  assert.ok(run(c, 'hist.length') > antes);
  assert.match(run(c, 'hist[hist.length-1].text'), /Sua vez/);
  run(c, 'pttOn()');
  assert.strictEqual(run(c, 'txOn'), 1);
  assert.strictEqual(run(c, 'wq'), '');
});

test('quem entrou antes na fila fala primeiro (ordem por contador)', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia'); peer(c, 'C', 'Caio');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Geral' });
  await recv(c, 'C', { t: 'q', ch: 'Geral', lc: 1, on: 1 });
  run(c, 'pttOn()');                                    // eu entro depois (lc maior)
  await recv(c, 'B', { t: 'tx', on: false, ch: 'Geral' });
  assert.strictEqual(run(c, "qlist('Geral')[0]"), 'C');
  run(c, 'pttOn()');
  assert.strictEqual(run(c, 'txOn'), 0, 'não pode furar a fila');
  assert.strictEqual(run(c, 'qpos("Geral")'), 2);
});

test('saída de quem está na frente da fila passa a vez', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia'); peer(c, 'C', 'Caio');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Geral' });
  await recv(c, 'C', { t: 'q', ch: 'Geral', lc: 1, on: 1 });
  run(c, 'pttOn()');
  await recv(c, 'B', { t: 'tx', on: false, ch: 'Geral' });
  run(c, "drop('C')");
  assert.strictEqual(run(c, "qlist('Geral')[0]"), ID(c));
  assert.match(run(c, 'hist[hist.length-1].text'), /Sua vez/);
});

test('falar em um canal não bloqueia outro canal', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Equipes' });
  run(c, 'pttOn()');                                    // estou em Geral
  assert.strictEqual(run(c, 'txOn'), 1);
});

test('áudio: só toca o canal atual, mas Emergência toca sempre', async () => {
  const c = newCtx(), b = peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Equipes' });
  assert.strictEqual(b.p.au.muted, true);
  await recv(c, 'B', { t: 'tx', on: false, ch: 'Equipes' });
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Emergência' });
  assert.strictEqual(b.p.au.muted, false);
  await recv(c, 'B', { t: 'tx', on: false, ch: 'Emergência' });
  run(c, "chn='Equipes'");
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Equipes' });
  assert.strictEqual(b.p.au.muted, false);
});

test('silenciar aparelho continua valendo mesmo no canal certo', async () => {
  const c = newCtx(), b = peer(c, 'B', 'Bia');
  b.p.mu = 1;
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Geral' });
  assert.strictEqual(b.p.au.muted, true);
});

test('não troca de canal enquanto transmite', async () => {
  const c = newCtx(); peer(c, 'B', 'Bia');
  run(c, 'pttOn()'); run(c, "setCh('Equipes')");
  assert.strictEqual(run(c, 'chn'), 'Geral');
});

test('trocar de canal sai da fila do canal anterior', async () => {
  const c = newCtx(), b = peer(c, 'B', 'Bia');
  await recv(c, 'B', { t: 'tx', on: true, ch: 'Geral' });
  run(c, 'pttOn()'); run(c, "setCh('Equipes')");
  assert.strictEqual(run(c, 'wq'), '');
  assert.ok(b.sent.find(x => x.t == 'q' && !x.on));
});

test('quem cria o convite vira administrador', async () => {
  const c = newCtx();
  run(c, "pend=null;adm=''");
  c.RTCPeerConnection = undefined;                       // invite() precisa de WebRTC real; testamos só a regra
  run(c, "if(!adm)adm=ID");
  assert.strictEqual(run(c, 'adm'), ID(c));
});

test('quem entra adota o administrador de quem o convidou', async () => {
  const c = newCtx(); peer(c, 'A', 'Ana');
  await recv(c, 'A', { t: 'hi', id: 'A', name: 'Ana', adm: 'A', mem: 0 });
  assert.strictEqual(run(c, 'adm'), 'A');
});

test('dois sem rede que se convidaram: os dois concordam (menor id)', async () => {
  const c1 = newCtx(), c2 = newCtx();
  const id1 = ID(c1), id2 = ID(c2);
  run(c1, 'adm=ID'); run(c2, 'adm=ID');
  peer(c1, id2, 'Dois'); peer(c2, id1, 'Um');
  await recv(c1, id2, { t: 'hi', id: id2, name: 'Dois', adm: id2, mem: 0 });
  await recv(c2, id1, { t: 'hi', id: id1, name: 'Um', adm: id1, mem: 0 });
  assert.strictEqual(run(c1, 'adm'), run(c2, 'adm'));
});

test('administrador existente não é trocado por quem chega sozinho', async () => {
  const c = newCtx(); run(c, 'adm=ID'); peer(c, 'X', 'Xis'); peer(c, 'N', 'Novo');
  await recv(c, 'X', { t: 'hi', id: 'X', name: 'Xis', adm: '', mem: 0 });   // já tem alguém conectado
  await recv(c, 'N', { t: 'hi', id: 'N', name: 'Novo', adm: 'N', mem: 0 });
  assert.strictEqual(run(c, 'adm'), ID(c));
});

test('só o administrador consegue remover alguém', async () => {
  const c = newCtx(); peer(c, 'A', 'Ana'); peer(c, 'B', 'Bia'); peer(c, 'D', 'Davi');
  run(c, "adm='A'");
  await recv(c, 'B', { t: 'kick', id: 'D' });            // Bia não é admin
  assert.ok(run(c, "!!peers['D']"));
  await recv(c, 'A', { t: 'kick', id: 'D' });            // Ana é admin
  assert.ok(run(c, "!peers['D']"));
});

test('removido não volta: hi com id banido é derrubado', async () => {
  const c = newCtx(); peer(c, 'A', 'Ana'); peer(c, 'D', 'Davi');
  run(c, "adm='A'");
  await recv(c, 'A', { t: 'kick', id: 'D' });
  peer(c, 'tmp1', 'Davi');
  await recv(c, 'tmp1', { t: 'hi', id: 'D', name: 'Davi', adm: 'A', mem: 1 });
  assert.ok(run(c, "!peers['D']&&!peers['tmp1']"));
});

test('ser removido derruba todas as conexões', async () => {
  const c = newCtx(); peer(c, 'A', 'Ana'); peer(c, 'B', 'Bia');
  run(c, "adm='A'");
  await recv(c, 'A', { t: 'kick', id: ID(c) });
  assert.strictEqual(run(c, 'Object.keys(peers).length'), 0);
});

test('administrador sai: menor id restante assume', async () => {
  const c = newCtx(); peer(c, 'A', 'Ana'); peer(c, 'B', 'Bia');
  run(c, "adm='A'");
  run(c, "drop('A')");
  const esperado = [ID(c), 'B'].sort()[0];
  assert.strictEqual(run(c, 'adm'), esperado);
});

test('reconexão do administrador (mesmo id) não troca o administrador', async () => {
  const c = newCtx(); peer(c, 'A', 'Ana');
  run(c, "adm='A'");
  peer(c, 'tmpA', 'Ana');
  await recv(c, 'tmpA', { t: 'hi', id: 'A', name: 'Ana', adm: 'A', mem: 0 });
  assert.strictEqual(run(c, 'adm'), 'A');
});

test('mensagens antigas sem canal aparecem em Geral', async () => {
  const c = newCtx();
  assert.ok(run(c, "inCh({text:'velha'})"));
  run(c, "chn='Equipes'");
  assert.ok(!run(c, "inCh({text:'velha'})"));
});

(async () => {
  let f = 0;
  for (const [n, fn] of tests) { try { await fn(); console.log('ok   ', n); } catch (e) { f++; console.log('FALHA', n, '-', e.message); } }
  console.log(f ? f + ' falha(s) de ' + tests.length : 'todos passaram (' + tests.length + ')');
  process.exit(f ? 1 : 0);
})();
