name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Montar projeto
        run: |
          mkdir -p proj/app/src/main/java/br/com/localtalk proj/app/src/main/assets
          cp AndroidManifest.xml proj/app/src/main/
          cp MainActivity.java proj/app/src/main/java/br/com/localtalk/
          cp index.html proj/app/src/main/assets/
          cd proj
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
          echo 'rootProject.name = "LocalTalk"' >> settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'br.com.localtalk'; compileSdk 34; defaultConfig { applicationId 'br.com.localtalk'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }" >> app/build.gradle
      - name: Construir APK
        working-directory: proj
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTalk-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
